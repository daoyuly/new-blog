<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老友小聚 · 9月29日晚 · 簋街四合院</title>
<meta name="description" content="9月29日（周二）晚6:30，簋街花家怡园四合院，四位老友，一桌好菜，不谈工作，只叙旧。">
<meta property="og:title" content="老友小聚 · 今晚六点半 · 簋街四合院">
<meta property="og:description" content="四位老友，一桌好菜。不谈工作，只叙旧。">
<style>
  :root{
    --paper:#f4efe3;
    --card:#fdfaf2;
    --ink:#3a3226;
    --ink-light:#7d7061;
    --gold:#a8823c;
    --seal:#9e2f26;
    --line:#c8b78d;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSongti-SC","STZhongsong","SimSun",serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.55), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(168,130,60,.10), transparent 50%),
      radial-gradient(ellipse at 50% 50%, var(--paper) 0%, #ece4d0 100%);
    min-height:100vh;
    min-height:100svh;
    display:flex;
    justify-content:center;
    padding:40px 16px;
    overflow-x:hidden;
  }
  .watermark{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-size:56vmin;
    color:var(--ink);
    opacity:.035;
    pointer-events:none;
    user-select:none;
    z-index:0;
    line-height:1;
  }
  .side{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    writing-mode:vertical-rl;
    letter-spacing:.65em;
    font-size:14px;
    color:#8a7a55;
    opacity:.75;
    z-index:1;
    user-select:none;
  }
  .side.left{left:5vw;}
  .side.right{right:5vw;}
  @media (max-width:900px){.side{display:none;}}

  .card{
    position:relative;
    z-index:2;
    margin:auto;
    width:100%;
    max-width:600px;
    background:rgba(253,250,242,.92);
    border:1px solid var(--line);
    box-shadow:0 24px 60px -20px rgba(80,60,20,.28), 0 2px 8px rgba(80,60,20,.08);
    padding:64px 48px 52px;
    text-align:center;
    animation:rise .9s ease-out both;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:9px;
    border:1px solid rgba(160,140,90,.38);
    pointer-events:none;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(18px);}
    to{opacity:1;transform:translateY(0);}
  }

  .kicker{
    font-size:13px;
    letter-spacing:.55em;
    text-indent:.55em;
    color:var(--gold);
    margin-bottom:22px;
  }
  h1{
    font-size:clamp(40px,9vw,54px);
    font-weight:700;
    letter-spacing:.28em;
    text-indent:.28em;
    line-height:1.15;
  }
  .sub{
    margin-top:14px;
    font-size:15px;
    letter-spacing:.35em;
    text-indent:.35em;
    color:var(--ink-light);
  }

  .orn{
    display:flex;
    align-items:center;
    gap:14px;
    margin:34px auto 30px;
    width:82%;
  }
  .orn::before,.orn::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--line));
  }
  .orn::after{background:linear-gradient(90deg,var(--line),transparent);}
  .orn span{
    font-size:12px;
    color:var(--gold);
  }

  .letter{
    font-size:17px;
    line-height:2.15;
    letter-spacing:.12em;
    color:var(--ink);
  }
  .letter p{margin:0;}

  .info{
    margin-top:38px;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .item{
    display:flex;
    align-items:flex-start;
    gap:18px;
  }
  .num{
    flex:none;
    width:40px;height:40px;
    border:1px solid var(--gold);
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:16px;
    color:var(--gold);
    margin-top:2px;
  }
  .item h2{
    font-size:13px;
    letter-spacing:.5em;
    color:var(--ink-light);
    font-weight:400;
    margin-bottom:7px;
  }
  .item .big{
    font-size:19px;
    letter-spacing:.08em;
    font-weight:600;
  }
  .item .note{
    margin-top:5px;
    font-size:13.5px;
    color:var(--ink-light);
    letter-spacing:.06em;
    line-height:1.9;
  }

  .map-btn{
    display:inline-block;
    margin-top:34px;
    padding:12px 42px;
    border:1px solid var(--seal);
    color:var(--seal);
    text-decoration:none;
    font-size:14px;
    letter-spacing:.35em;
    text-indent:.35em;
    transition:all .25s ease;
  }
  .map-btn:hover{
    background:var(--seal);
    color:var(--card);
  }

  footer{
    margin-top:42px;
  }
  .rsvp{
    font-size:14px;
    color:var(--ink-light);
    letter-spacing:.2em;
  }
  .seal{
    width:58px;height:58px;
    margin:26px auto 18px;
    background:var(--seal);
    color:#f6f1e4;
    font-size:30px;
    font-weight:700;
    display:grid;
    place-items:center;
    border-radius:6px;
    position:relative;
    box-shadow:0 4px 14px rgba(158,47,38,.35);
    animation:stamp .55s .7s cubic-bezier(.2,1.5,.4,1) both;
  }
  .seal::after{
    content:"";
    position:absolute;
    inset:4px;
    border:1px solid rgba(246,241,228,.65);
    border-radius:3px;
  }
  @keyframes stamp{
    from{opacity:0;transform:scale(1.7) rotate(-12deg);}
    to{opacity:1;transform:scale(1) rotate(-4deg);}
  }
  .sign{
    font-size:13px;
    letter-spacing:.6em;
    text-indent:.6em;
    color:var(--ink-light);
  }

  @media (max-width:480px){
    .card{padding:52px 26px 44px;}
    .letter{font-size:15.5px;}
    .item .big{font-size:17px;}
  }
  @media (prefers-reduced-motion:reduce){
    .card,.seal{animation:none;}
  }
</style>
</head>
<body>

<div class="watermark">聚</div>
<div class="side left">秋光正好</div>
<div class="side right">莫负老友</div>

<main class="card">
  <header>
    <p class="kicker">秋夜 · 簋街 · 四合院</p>
    <h1>老友小聚</h1>
    <p class="sub">不谈工作 · 只叙旧</p>
  </header>

  <div class="orn"><span>❖</span></div>

  <section class="letter">
    <p>有些话，打字没滋味。</p>
    <p>今晚下了班，找个四合院坐下——</p>
    <p>一桌菜，几盏茶，</p>
    <p>把近来的日子慢慢聊回来。</p>
  </section>

  <section class="info">
    <div class="item">
      <span class="num">壹</span>
      <div>
        <h2>何 时</h2>
        <p class="big">9 月 29 日（周二）晚 6:30</p>
        <p class="note">六点半开席，请赶在第一道菜前落座。</p>
      </div>
    </div>
    <div class="item">
      <span class="num">贰</span>
      <div>
        <h2>何 处</h2>
        <p class="big">花家怡园 · 四合院总店</p>
        <p class="note">东城区东直门内大街 235 号（簋街）<br>地铁 5 号线北新桥站 · 2 号线东直门站，步行可达</p>
      </div>
    </div>
    <div class="item">
      <span class="num">叁</span>
      <div>
        <h2>何 人</h2>
        <p class="big">四位老友 · 一桌好菜</p>
        <p class="note">位子已留好，回个话人就齐了。</p>
      </div>
    </div>
  </section>

  <a class="map-btn" href="https://uri.amap.com/search?keyword=%E8%8A%B1%E5%AE%B6%E6%80%A1%E5%9B%AD%E5%9B%9B%E5%90%88%E9%99%A2%E6%80%BB%E5%BA%97" target="_blank" rel="noopener">在高德地图中打开 ↗</a>

  <footer>
    <p class="rsvp">收到请回话——菜好按人头点。</p>
    <div class="seal">聚</div>
    <p class="sign">敬备薄酌 · 恭候光临</p>
  </footer>
</main>

</body>
</html>
